name: CI and Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar pacote e CLI
        run: python -m pip install --no-deps .
      - name: Testes unitários e adversariais
        run: python -m unittest discover -s tests -v
      - name: Verificar sintaxe
        run: python -m compileall -q src tests scripts
      - name: Smoke test da CLI (baseline)
        run: sudoboundary audit --policy examples/baseline.json --fail-on high --format text
      - name: Verificar contrato de acesso
        run: sudoboundary assert --policy examples/baseline.json --queries examples/queries.json --format text
      - name: Confirmar detecção de candidato inseguro
        shell: python
        run: |
          import subprocess
          result = subprocess.run(['sudoboundary', 'audit', '--policy', 'examples/candidate-risky.json', '--fail-on', 'high', '--format', 'text'], check=False, capture_output=True, text=True)
          print(result.stdout)
          assert result.returncode == 1, f'exit code esperado 1, obtido {result.returncode}: {result.stderr}'

  release:
    name: Release após matriz aprovada
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Validar coerência de versão
        shell: bash
        run: |
          python -c "import tomllib; p=tomllib.loads(open('pyproject.toml','rb').read().decode()); assert p['project']['version']=='1.0.0'"
      - name: Construir pacote determinístico e checksum
        run: python scripts/package.py
      - name: Publicar release oficial (apenas após CI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v1.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe; nenhum artefato será substituído."
            exit 0
          fi
          gh release create "$TAG" dist/sudoboundary-v1.0.0-source.zip dist/sudoboundary-v1.0.0-source.zip.sha256 \
            --target "$GITHUB_SHA" --title "SudoBoundary $TAG" --notes-file RELEASE_NOTES.md
